[package]
name = "eis-storage-core"
version = "0.1.0"
edition = "2021"
description = "Shared Rust library for storage and USB device operations"
license = "MIT OR Apache-2.0"

[lib]
name = "eis_storage_core"
crate-type = ["rlib", "cdylib"]

[dependencies]
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
libc = "0.2"
log = "0.4"
bytes = "1"

[dev-dependencies]

[profile.release]
opt-level = 3
